name: ancora_ble
description: "No Ancora BLE (GATT Server) para sistema de navegacao assistiva - TCC."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # BLE Peripheral / GATT Server (Android anuncia o Service UUID)
  ble_peripheral: ^2.4.0

  # Foreground Service (mantem o radio BLE vivo com a tela apagada)
  flutter_foreground_task: ^8.17.0

  # Permissoes em tempo de execucao (Android 12+)
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: false
